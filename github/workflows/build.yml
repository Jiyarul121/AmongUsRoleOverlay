
name: Build Among Us Role Overlay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -q AmongUsRoleOverlay-AndroidStudio.zip -d extracted
          test -f extracted/AmongUsRoleOverlay/settings.gradle

      - name: Build APK
        working-directory: extracted/AmongUsRoleOverlay
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsRoleOverlay-debug-apk
          path: extracted/AmongUsRoleOverlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

